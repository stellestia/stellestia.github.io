# =========================================================
# Site
# =========================================================

theme: jekyll-theme-chirpy

lang: ko-KR
timezone: +0900

title: "test test test test test"
tagline: "chirpy jekyll theme"
description: "test test test test test"

url: "https://stellestia.github.io"
baseurl: ""

# =========================================================
# Author / Social
# =========================================================

github:
  username: stellestia

social:
  name: stellestia
  email: example@domain.com
  links:
    - https://github.com/stellestia

# =========================================================
# Appearance
# =========================================================

theme_mode:

avatar:

toc: true

# =========================================================
# Posts
# =========================================================

paginate: 10

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# =========================================================
# Chirpy Tabs
# =========================================================

collections:
  tabs:
    output: true
    sort_by: order

# =========================================================
# Markdown / Jekyll
# =========================================================

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# =========================================================
# Archives
# =========================================================

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# =========================================================
# PWA
# =========================================================

pwa:
  enabled: false

# =========================================================
# Files to exclude
# =========================================================

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
